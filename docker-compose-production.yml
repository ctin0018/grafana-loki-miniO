services:
  nginx:
    build:
      context: ./nginx
      dockerfile: dockerfile
    container_name: nginx_auth_proxy
    ports:
      - "80:80"
    volumes:
      # Mount your nginx config into OpenResty's nginx location
      - ./nginx/nginx.conf:/usr/local/openresty/nginx/conf/nginx.conf:ro
    depends_on:
      - grafana
      - minio
      - cerbos
    networks:
      - observability

  cerbos:
    image: cerbos/cerbos:latest
    container_name: cerbos
    ports:
      - "3592:3592"
    command: ["server", "--config=/config/config.yaml"]
    volumes:
      - ./cerbos/config:/config:ro
      - ./cerbos/policies:/policies:ro
    networks:
      - observability


  # ldap-auth:
  #   image: ghcr.io/nginx-ldap/nginx-ldap-auth-service:latest
  #   container_name: ldap_auth_service
  #   environment:
  #     # --- Conpany LDAP/AD server ---
  #     LDAP_AUTH_URL: "ldap://your-ldap-server.com:389"
  #     LDAP_AUTH_BIND_DN: "cn=binder,ou=users,dc=example,dc=com"
  #     LDAP_AUTH_BIND_PASSWORD: "binder_password"
  #     LDAP_AUTH_BASE_DN: "ou=users,dc=example,dc=com"
  #     # --- Session config ---
  #     LDAP_AUTH_SECRET_KEY: "a_very_secret_key_for_sessions"
  #   networks:
  #     - observability

  loki:
    image: grafana/loki:3.4.1
    container_name: loki_container_miniO
    user: "10001:10001"
    ports:
      - "3101:3100"
      - "9096:9095"
    volumes:
      - ./loki-data:/var/lib/loki
      - ./loki:/etc/loki
    command:
      - -config.file=/etc/loki/loki-config.yaml
      - -config.expand-env=true
    depends_on:
      create-minio-bucket:
        condition: service_completed_successfully

    networks:
      - observability

  alloy:
    image: grafana/alloy:latest
    container_name: alloy_container_miniO
    ports:
      - "12346:12345"
      - "4319:4317"  # OTLP HTTP
      - "4320:4318"  # OTLP gRPC  
    volumes:
      - ./alloy:/etc/alloy:ro
      - ./logs:/var/log/app:ro
      - alloy-data:/var/lib/alloy/data
    command:
      - run
      - --server.http.listen-addr=0.0.0.0:12345
      - --storage.path=/var/lib/alloy/data
      - --stability.level=public-preview  # cluster host??
      - /etc/alloy/config.alloy
    depends_on:
      - loki
    networks:
      - observability

  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana_container_miniO
    ports:
      - "3002:3000"
    volumes:
      - grafana-storage:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      # Additional configurations for RBAC
      - ./grafana/provisioning/rbac:/etc/grafana/provisioning/rbac
    environment:
      # Admin user configuration
      - GF_SECURITY_ADMIN_USER=admin
      - GF_SECURITY_ADMIN_PASSWORD=admin123
      - GF_SECURITY_ADMIN_EMAIL=admin@localhost
      # Server configuration
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Authentication configuration
      - GF_AUTH_BASIC_ENABLED=true
      - GF_AUTH_PROXY_ENABLED=false
      - GF_AUTH_DISABLE_LOGIN_FORM=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
      # RBAC configuration
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_USERS_AUTO_ASSIGN_ORG=true
      - GF_USERS_AUTO_ASSIGN_ORG_ROLE=Viewer
      # Organization settings
      - GF_ORG_NAME=Main Org.
      # Role-based access control
      - GF_SECURITY_ROLE_OPTIONS_ENABLED=true
      # Enhanced RBAC configuration
      - GF_UNIFIED_ALERTING_ENABLED=true
      - GF_RBAC_CUSTOM_ROLE_AUTH_ENABLED=true
      - GF_USERS_VIEWERS_CAN_EDIT=false
      - GF_USERS_EDITORS_CAN_ADMIN=false
      # Security settings
      - GF_SECURITY_ALLOW_EMBEDDING=false
      - GF_SECURITY_COOKIE_SECURE=true
      - GF_SECURITY_COOKIE_SAMESITE=lax
      - GF_SECURITY_DISABLE_GRAVATAR=true
      # Session settings
      - GF_SESSION_PROVIDER=database
      # User management
      - GF_USERS_DEFAULT_THEME=dark
      - GF_AUTH_SIGNUP_EMAIL_VERIFY=true
      - GF_SMTP_ENABLED=true
      - GF_SMTP_HOST=smtp.example.com:587
      - GF_SMTP_USER=admin@example.com
      - GF_SMTP_PASSWORD=smtp_password
      - GF_SMTP_FROM_ADDRESS=admin@example.com
      - GF_SMTP_FROM_NAME=Grafana Admin
    networks:
      - observability 

  # VM Log Simulator - simulates 5 different VMs
  vm-simulator:
    image: python:3.9-alpine
    container_name: vm_simulator_miniO
    working_dir: /app
    volumes:
      - ./logs:/var/log/app
      - ./scripts:/app
    command: python vm_log_simulator.py
    networks:
      - observability

  minio:
    image: minio/minio:latest
    container_name: minio
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: admin123
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    ports:
      - "9000:9000"   # S3 API
      - "9001:9001"   # Admin UI
    networks:
      - observability
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 30s
      timeout: 10s
      retries: 3


  create-minio-bucket:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    environment:
      MC_HOST_myminio: http://admin:admin123@minio:9000
    command: >
      mc alias set local http://minio:9000 admin admin123 &&
      echo 'Waiting for MinIO to be ready...' &&
      sleep 5 &&
      echo 'Creating bucket: logs...' &&
      mc mb local/logs --ignore-existing &&
      echo 'Setting bucket policy to public...' &&
      mc anonymous set public local/logs &&
      echo 'Bucket setup complete.' &&
      exit 0;
    networks:
      - observability


networks:
  observability:
    driver: bridge

volumes:
  alloy-data:
  grafana-storage:
  minio-data: