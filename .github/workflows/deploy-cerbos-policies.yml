name: Deploy Cerbos Policies

on:
  workflow_dispatch:
  push:
    paths:
      - 'cerbos/policies/**'

jobs:
  deploy:
    name: Copy policies to host and restart Cerbos
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Copy policies to remote host
        uses: appleboy/scp-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          source: 'cerbos/policies/*'
          target: '${{ secrets.CERBOS_REMOTE_POLICIES_PATH }}'

      - name: Restart cerbos container on remote host
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: |
            cd ${{ secrets.CERBOS_REMOTE_BASE_PATH }} || exit 1
            docker compose restart cerbos || docker compose up -d cerbos
