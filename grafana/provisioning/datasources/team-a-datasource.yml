apiVersion: 1

datasources:
  - name: 'Loki - Team A' # Tell user this is Team A, only for this team, so need to be very readable
    type: loki
    access: proxy # must be proxy mode，Grafana server will add Header
    url: http://loki:3100
    isDefault: false
    jsonData:
      # Core config to tell Grafana when sending the requests need to add HTTP Header
      httpHeaderName1: 'X-Scope-OrgID'
    secureJsonData:
      # Core config value of Header above
      httpHeaderValue1: 'team-a'