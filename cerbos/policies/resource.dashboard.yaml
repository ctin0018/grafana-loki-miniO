apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: dashboard
  rules:
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["viewer", "admin"]
      condition:
        match:
          expr: request.principal.attr.team == request.resource.attr.team

    - actions: ["edit", "delete"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
