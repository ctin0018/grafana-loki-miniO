apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: dashboard
  rules:
    # The Consultant role can only view dashboards
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["consultant"]

    # The Platform Member role can view and edit, but not delete
    - actions: ["view", "edit"]
      effect: EFFECT_ALLOW
      roles: ["platform_member"]

    # The Platform Lead role has full control
    - actions: ["view", "edit", "delete"]
      effect: EFFECT_ALLOW
      roles: ["platform_lead"]