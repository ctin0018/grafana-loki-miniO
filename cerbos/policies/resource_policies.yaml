apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: dashboard
  importDerivedRoles:
    - common_roles
  rules:
    # View access - Based on team membership
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["viewer", "analyst", "engineer", "admin", "consultant"]
      condition:
        match:
          expr: request.resource.attr.team == request.principal.attr.team || request.principal.roles.includes('admin')

    # Edit access - Team members with appropriate roles
    - actions: ["edit"]
      effect: EFFECT_ALLOW
      roles: ["analyst", "engineer", "admin"]
      condition:
        match:
          expr: request.resource.attr.team == request.principal.attr.team || request.principal.roles.includes('admin')

    # Delete access - Only admins
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      roles: ["admin"]

    # Create access - Based on role and department
    - actions: ["create"]
      effect: EFFECT_ALLOW
      roles: ["analyst", "engineer", "admin"]
      condition:
        match:
          expr: request.principal.attr.department in ['engineering', 'operations', 'strategy', 'innovation']

    # Admin actions - Full control for platform and AIOps teams
    - actions: ["admin", "share", "export"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
      condition:
        match:
          expr: request.principal.attr.department in ['engineering', 'operations']

---
# Datasource policies
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: datasource
  rules:
    # View access - All authenticated users
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["viewer", "analyst", "engineer", "admin", "consultant"]

    # Modify access - Only admin roles
    - actions: ["edit", "create", "delete"]
      effect: EFFECT_ALLOW
      roles: ["admin"]
      condition:
        match:
          expr: request.principal.attr.department in ['engineering', 'operations']

---
# Alert policies
apiVersion: api.cerbos.dev/v1
resourcePolicy:
  version: default
  resource: alert
  rules:
    # View alerts
    - actions: ["view"]
      effect: EFFECT_ALLOW
      roles: ["analyst", "engineer", "admin"]
      condition:
        match:
          expr: request.resource.attr.team == request.principal.attr.team || request.principal.roles.includes('admin')

    # Create/Edit alerts
    - actions: ["create", "edit"]
      effect: EFFECT_ALLOW
      roles: ["engineer", "admin"]
      condition:
        match:
          expr: request.principal.attr.department in ['engineering', 'operations']

    # Delete alerts
    - actions: ["delete"]
      effect: EFFECT_ALLOW
      roles: ["admin"]